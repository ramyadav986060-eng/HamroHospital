{% extends 'patients/_section_base.html' %}
{% block section_body %}
<div class="table-responsive">
    <table class="table table-hover align-middle small">
        <thead><tr><th>Claim #</th><th>Submitted</th><th>Status</th></tr></thead>
        <tbody>
        {% for c in records %}
            <tr>
                <td>{{ c.claim_number }}</td>
                <td>{{ c.submitted_at|date:"Y-m-d H:i" }}</td>
                <td>{{ c.get_status_display }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No insurance claims for this patient.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
