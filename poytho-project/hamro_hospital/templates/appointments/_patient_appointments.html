{% extends 'patients/_section_base.html' %}
{% block section_body %}
<div class="table-responsive">
    <table class="table table-hover align-middle small">
        <thead><tr><th>Date</th><th>Department</th><th>Payment Status</th></tr></thead>
        <tbody>
        {% for a in records %}
            <tr>
                <td>{{ a.preferred_date }}</td>
                <td>{{ a.department }}</td>
                <td>{{ a.get_payment_status_display }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No appointment records for this patient.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
