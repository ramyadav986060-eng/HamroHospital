{% extends 'dashboard_base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block dashboard_content %}
<form method="post" class="tuh-card p-4" style="max-width:700px;">
    {% csrf_token %}
    <div class="row g-3">
    {% for field in form %}
        <div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary mt-3">Save</button>
    <a href="{% url 'pharmacy:medicine_list' %}" class="btn btn-outline-secondary mt-3">Cancel</a>
</form>
{% endblock %}
