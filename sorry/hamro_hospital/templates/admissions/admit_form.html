{% extends 'dashboard_base.html' %}
{% block title %}Admit {{ patient.full_name }}{% endblock %}
{% block page_title %}Admit Patient: {{ patient.full_name }}{% endblock %}
{% block dashboard_content %}
<form method="post" class="tuh-card p-4" style="max-width:700px;">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Admit Patient</button>
</form>
{% endblock %}
