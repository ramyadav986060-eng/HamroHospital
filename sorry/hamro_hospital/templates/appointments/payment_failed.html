{% extends 'base.html' %}
{% block title %}Payment Failed{% endblock %}
{% block content %}
<section class="container py-5 text-center">
    <div class="tuh-card p-5 mx-auto" style="max-width:500px;">
        <i class="bi bi-x-circle fs-1 text-danger"></i>
        <h4 class="fw-bold mt-3">Payment Failed</h4>
        <p class="text-muted">Your eSewa payment could not be completed. No amount has been charged.</p>
        {% if appointment %}
        <a href="{% url 'appointments:pay' appointment.transaction_uuid %}" class="btn btn-primary">Try Again</a>
        {% else %}
        <a href="{% url 'appointments:book_appointment' %}" class="btn btn-primary">Book Again</a>
        {% endif %}
    </div>
</section>
{% endblock %}
