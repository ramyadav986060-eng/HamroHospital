{% extends 'dashboard_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Referral - {{ HOSPITAL_NAME }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="h3 mb-0 text-gray-800">Create Referral</h2>
        <p class="text-muted mb-0">Refer patient to another department</p>
    </div>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="tuh-card p-4">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-send"></i> Send Referral
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
