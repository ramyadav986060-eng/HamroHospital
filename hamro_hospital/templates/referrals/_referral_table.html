<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Patient</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>{% for r in referrals %}<tr><td>{{ r.patient.full_name }}<br><small>{{ r.patient.patient_code }}</small></td><td>{{ r.get_referral_type_display }}</td><td>{{ r.get_status_display }}</td><td><a href="{% url 'referrals:referral_detail' r.pk %}" class="btn btn-sm btn-outline-primary">Open</a></td></tr>{% empty %}<tr><td colspan="4" class="text-center text-muted">No records.</td></tr>{% endfor %}</tbody></table></div>
